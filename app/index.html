<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>JF Go (lab phone)</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  #app { height: 100%; }
  #app > .client-tablet, #app .m-root, #app .m-frame { height: 100%; }
  .lab-perm { position: fixed; inset: 0; z-index: 2147483000; background: rgba(0,0,0,.28); display: grid; place-items: center; animation: labFade .18s ease-out; }
  .lab-perm-card { width: 270px; border-radius: 14px; background: rgba(242,242,247,.92); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8); text-align: center; overflow: hidden; font: 13px/1.35 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; color: #000; box-shadow: 0 20px 60px -20px rgba(0,0,0,.4); }
  
  .lab-perm-title { font-weight: 600; font-size: 17px; line-height: 1.3; padding: 19px 16px 4px; }
  .lab-perm-body { padding: 0 16px 16px; }
  .lab-perm-btns button { display: block; width: 100%; border: 0; border-top: .5px solid rgba(60,60,67,.29); background: transparent; color: #0a84ff; font: 17px -apple-system, "SF Pro Text", Inter, sans-serif; padding: 11px 8px; cursor: pointer; }
  .lab-perm-btns button:active { background: rgba(0,0,0,.06); }
  html[data-jf-dark] .lab-perm-card { background: rgba(44,44,46,.92); color: #fff; }
  .lab-left { height: 100%; display: grid; place-items: center; padding: 24px; background: #f2f2f7; font-family: -apple-system, Inter, sans-serif; }
  .lab-left-card { background: #fff; border-radius: 22px; padding: 22px 20px; max-width: 320px; box-shadow: 0 16px 40px -18px rgba(30,40,70,.35); }
  html[data-jf-dark] .lab-left { background: #000; } html[data-jf-dark] .lab-left-card { background: #1c1c1e; color: #fff; }
  .lab-left-title { font-weight: 700; font-size: 20px; letter-spacing: -.02em; line-height: 1.15; margin-bottom: 8px; }
  .lab-left p { margin: 0 0 16px; color: rgba(60,60,67,.75); font-size: 15px; line-height: 1.4; }
  html[data-jf-dark] .lab-left p { color: rgba(235,235,245,.65); }
  .lab-left-btn { border: 0; border-radius: 14px; background: #1F2025; color: #fff; font: 600 16px -apple-system, Inter, sans-serif; padding: 13px 18px; width: 100%; cursor: pointer; }
  @keyframes labFade { from { opacity: 0 } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
